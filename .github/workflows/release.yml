# repoctl-managed: release/v2
name: Release

on:
  push:
    branches:
      - main
      - alpha
      - beta
      - rc
      - next
  workflow_dispatch:
    inputs:
      mode:
        description: Release operation
        required: true
        default: auto
        type: choice
        options:
          - auto
          - prepare
          - publish
          - publish-unpublished
      package:
        description: Package used for unpublished-version recovery
        required: false
        type: string
      version:
        description: Version used for unpublished-version recovery
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  HUSKY: 0
  NPM_CONFIG_PROVENANCE: true
  npm_config_registry: https://registry.npmjs.org

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Release Tooling
        run: pnpm run tooling:build

      - name: Run repo release CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_RELEASE_MODE: ${{ inputs.mode || 'auto' }}
          REPO_RELEASE_PACKAGE: ${{ inputs.package }}
          REPO_RELEASE_VERSION: ${{ inputs.version }}
        run: pnpm exec repo release ci
