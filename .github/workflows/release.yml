name: Release

on:
  push:
    branches:
      - main
      - alpha
      - beta
      - rc
      - next
  workflow_dispatch:
    inputs:
      mode:
        description: Release operation
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - publish-unpublished
      package:
        description: Package used to verify an unpublished-version recovery
        required: false
        type: string
      version:
        description: Version used to verify an unpublished-version recovery
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  HUSKY: 0
  NPM_CONFIG_PROVENANCE: true
  npm_config_registry: https://registry.npmjs.org

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  prepare:
    if: github.ref_name == 'main' && (github.event_name == 'push' || inputs.mode == 'prepare')
    name: Prepare Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Release Tooling
        run: pnpm run tooling:build

      - name: Consume pnpm change intents
        run: pnpm exec repo release stable prepare

      - name: Create or update Release PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release/pnpm-version
          delete-branch: true
          title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
          body: |
            This PR was generated by `pnpm version -r`.

            It updates package versions, repository changelogs, and `.changeset/ledger.yaml`.
          labels: release

  publish:
    if: github.ref_name == 'main' && github.event_name == 'push'
    name: Publish Stable Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Release Tooling
        run: pnpm run tooling:build

      - name: Check for pending change intents
        id: intents
        shell: bash
        run: |
          if compgen -G '.changeset/*.md' > /dev/null; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          else
            echo 'pending=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish stable packages
        if: steps.intents.outputs.pending == 'false'
        run: pnpm exec repo release stable publish

      - name: Publish release metadata
        if: steps.intents.outputs.pending == 'false' && hashFiles('pnpm-publish-summary.json') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS=$'\t' read -r package version; do
            tag="$package@$version"
            if ! git rev-parse "$tag" >/dev/null 2>&1; then
              git tag -a "$tag" -m "$tag"
              git push origin "refs/tags/$tag"
            fi
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --verify-tag --target "$GITHUB_SHA" --title "$tag" --generate-notes
          done < <(jq -r '.publishedPackages[] | [.name, .version] | @tsv' pnpm-publish-summary.json)

  recovery:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish-unpublished'
    name: Recover Unpublished Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Release Tooling
        run: pnpm run tooling:build

      - name: Validate recovery input
        shell: bash
        env:
          RECOVERY_PACKAGE: ${{ inputs.package }}
          RECOVERY_VERSION: ${{ inputs.version }}
        run: |
          if [[ -z "$RECOVERY_PACKAGE" || -z "$RECOVERY_VERSION" ]]; then
            echo 'package and version are required for publish-unpublished' >&2
            exit 1
          fi
          actual_version="$(pnpm --filter "$RECOVERY_PACKAGE" exec node -p "require('./package.json').version")"
          test "$actual_version" = "$RECOVERY_VERSION"

      - name: Publish recovered package
        env:
          RECOVERY_PACKAGE: ${{ inputs.package }}
        run: pnpm publish -r --filter "$RECOVERY_PACKAGE" --report-summary --provenance --no-git-checks

      - name: Verify recovered npm version
        shell: bash
        env:
          RECOVERY_PACKAGE: ${{ inputs.package }}
          RECOVERY_VERSION: ${{ inputs.version }}
        run: test "$(npm view "$RECOVERY_PACKAGE@$RECOVERY_VERSION" version)" = "$RECOVERY_VERSION"

      - name: Publish recovered release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS=$'\t' read -r package version; do
            tag="$package@$version"
            if ! git rev-parse "$tag" >/dev/null 2>&1; then
              git tag -a "$tag" -m "$tag"
              git push origin "refs/tags/$tag"
            fi
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --verify-tag --target "$GITHUB_SHA" --title "$tag" --generate-notes
          done < <(jq -r '.publishedPackages[] | [.name, .version] | @tsv' pnpm-publish-summary.json)

  prerelease:
    if: github.event_name == 'push' && github.ref_name != 'main'
    name: Publish Prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Release Tooling
        run: pnpm run tooling:build

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Publish Prerelease
        run: pnpm exec repo release pre publish

      - name: Publish prerelease metadata
        if: hashFiles('pnpm-publish-summary.json') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS=$'\t' read -r package version; do
            tag="$package@$version"
            if ! git rev-parse "$tag" >/dev/null 2>&1; then
              git tag -a "$tag" -m "$tag"
              git push origin "refs/tags/$tag"
            fi
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --verify-tag --target "$GITHUB_SHA" --title "$tag" --generate-notes
          done < <(jq -r '.publishedPackages[] | [.name, .version] | @tsv' pnpm-publish-summary.json)
